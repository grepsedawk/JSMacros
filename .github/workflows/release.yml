name: Release

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    name: Build Minecraft ${{ matrix.profile }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        profile: ['26.1', '26.2', '26.3']
    env:
      MODRINTH_PROJECT: XcnNwheM
    steps:
      - uses: actions/checkout@v4

      # Gradle launches on JDK 21 and uses the JDK 25 toolchain for Minecraft.
      - name: Set up JDK 25 (toolchain)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '25'

      - name: Set up JDK 21 (Gradle launcher)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          cache-overwrite-existing: true

      - name: Resolve channel and version from tag
        id: ver
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ github.event.release.tag_name }}"
          VER="${TAG#v}"
          VER="${VER%%+*}" # Preserve compatibility with vX.Y.Z+<mc> tags.
          case "$VER" in
            *-alpha*) CHANNEL=alpha ;;
            *-*) CHANNEL=beta ;;
            *) CHANNEL=release ;;
          esac
          MODVER=$(./gradlew -q printVersion \
            -PmcProfile=${{ matrix.profile }} \
            -Pchannel="$CHANNEL" \
            -Pmod_version="$VER" | tail -1 | tr -d '\n\r')
          {
            echo "tag=$TAG"
            echo "channel=$CHANNEL"
            echo "mod_version=$MODVER"
          } >> "$GITHUB_OUTPUT"

      - name: Test and package
        run: |
          ./gradlew check createDist checkProfileArtifacts \
            -PmcProfile=${{ matrix.profile }} \
            -Pchannel=${{ steps.ver.outputs.channel }} \
            -Pmod_version=${{ steps.ver.outputs.mod_version }}

      - name: Upload profile artifacts
        uses: actions/upload-artifact@v4
        with:
          name: jars-${{ matrix.profile }}
          if-no-files-found: error
          path: dist/${{ matrix.profile }}/*.jar

  upload-release-assets:
    name: Upload release assets
    permissions:
      contents: write
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download profile artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: jars-*
          path: release-artifacts

      - name: Collect main jars and deduplicate Python extension
        id: assets
        shell: bash
        env:
          V: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          V="${V#v}"
          V="${V%%+*}"
          mkdir release-assets
          for PROFILE in 26.1 26.2 26.3; do
            PRIMARY=$(find "release-artifacts/jars-$PROFILE" -type f -name "jsmacros-$PROFILE-$V*.jar" ! -name '*-extension*.jar' -print)
            PRIMARY_COUNT=$(printf '%s\n' "$PRIMARY" | awk 'NF { count++ } END { print count + 0 }')
            if [ "$PRIMARY_COUNT" -ne 1 ]; then
              echo "::error::Expected one main jar for $PROFILE, found $PRIMARY_COUNT"
              exit 1
            fi
            cp "$PRIMARY" release-assets/

            PYTHON=$(find "release-artifacts/jars-$PROFILE" -type f -name '*python*-extension*.jar' -print)
            PYTHON_COUNT=$(printf '%s\n' "$PYTHON" | awk 'NF { count++ } END { print count + 0 }')
            if [ "$PYTHON_COUNT" -ne 1 ]; then
              echo "::error::Expected one Python extension jar for $PROFILE, found $PYTHON_COUNT"
              exit 1
            fi
            printf '%s\t%s\n' "$PROFILE" "$PYTHON" >> python-jars.tsv
          done

          if [ "$(cut -f2 python-jars.tsv | xargs shasum -a 256 | awk '{print $1}' | sort -u | wc -l | tr -d ' ')" -eq 1 ]; then
            cp "$(awk -F '\t' 'NR == 1 { print $2 }' python-jars.tsv)" release-assets/
          else
            while IFS=$'\t' read -r PROFILE JAR; do
              BASENAME=$(basename "$JAR" .jar)
              cp "$JAR" "release-assets/$BASENAME-$PROFILE.jar"
            done < python-jars.tsv
          fi

          find release-assets -maxdepth 1 -type f -name '*.jar' -print | sort

      - name: Upload jars to the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: gh release upload "${{ github.event.release.tag_name }}" release-assets/*.jar --clobber

  publish-modrinth:
    name: Publish Minecraft ${{ matrix.profile }} to Modrinth
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        profile: ['26.1', '26.2', '26.3']
    env:
      MODRINTH_PROJECT: XcnNwheM
      MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25 (toolchain)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '25'

      - name: Set up JDK 21 (Gradle launcher)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          cache-overwrite-existing: true

      - name: Resolve channel and version from tag
        id: ver
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ github.event.release.tag_name }}"
          VER="${TAG#v}"
          VER="${VER%%+*}"
          case "$VER" in
            *-alpha*) CHANNEL=alpha ;;
            *-*) CHANNEL=beta ;;
            *) CHANNEL=release ;;
          esac
          MODVER=$(./gradlew -q printVersion \
            -PmcProfile=${{ matrix.profile }} \
            -Pchannel="$CHANNEL" \
            -Pmod_version="$VER" | tail -1 | tr -d '\n\r')
          {
            echo "channel=$CHANNEL"
            echo "mod_version=$MODVER"
          } >> "$GITHUB_OUTPUT"

      - name: Publish the compatibility group
        if: env.MODRINTH_TOKEN != ''
        run: |
          ./gradlew publishMods \
            -PmcProfile=${{ matrix.profile }} \
            -Pchannel=${{ steps.ver.outputs.channel }} \
            -Pmod_version=${{ steps.ver.outputs.mod_version }}

      # mod-publish-plugin cannot set the environment field per version.
      - name: Mark the exact Modrinth version as client-side
        if: env.MODRINTH_TOKEN != ''
        shell: bash
        env:
          V: ${{ steps.ver.outputs.mod_version }}
          PROFILE: ${{ matrix.profile }}
        run: |
          set -euo pipefail
          VERSION_NUMBER="$V+$PROFILE-fabric"
          export VERSION_NUMBER
          VID=$(curl -fsS -H "Authorization: $MODRINTH_TOKEN" \
                "https://api.modrinth.com/v3/project/$MODRINTH_PROJECT/version" \
            | python3 -c "import json, os, sys; versions=json.load(sys.stdin); target=os.environ['VERSION_NUMBER']; matches=[version['id'] for version in versions if version['version_number'] == target]; assert len(matches) == 1, f'expected one Modrinth version for {target}, found {len(matches)}'; print(matches[0])")
          curl -fsS -X PATCH \
            -H "Authorization: $MODRINTH_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"environment":"client_only"}' \
            "https://api.modrinth.com/v3/version/$VID"
          echo "Set $MODRINTH_PROJECT version $VID ($VERSION_NUMBER) to client_only"
