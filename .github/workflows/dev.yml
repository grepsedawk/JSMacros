name: Dev Build

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Minecraft ${{ matrix.profile }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        profile: ['26.1', '26.2', '26.3']
    steps:
      - uses: actions/checkout@v4

      # The build compiles against MC 26.1 (class file v69), which needs a JDK 25
      # toolchain. Gradle 8.14's Kotlin DSL can't run under JDK 25, so Gradle itself
      # is launched under JDK 21 (JAVA_HOME) while it auto-detects the JDK 25 toolchain.
      - name: Set up JDK 25 (toolchain)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '25'

      - name: Set up JDK 21 (Gradle launcher)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          cache-overwrite-existing: true

      - name: Test and package
        shell: bash
        run: |
          SHORT_SHA=${GITHUB_SHA::7}
          ./gradlew check createDist checkProfileArtifacts \
            -PmcProfile=${{ matrix.profile }} \
            -Pchannel=dev \
            -Pbuild_sha="$SHORT_SHA"

      - name: Test the client smoke harness
        run: python3 -m unittest discover -s scripts -p 'test_*.py'

      - name: Validate publishing configuration without uploading
        run: |
          ./gradlew publishMods --dry-run \
            -PmcProfile=${{ matrix.profile }} \
            -Pmodrinth_id=XcnNwheM \
            -Pmodrinth_token=validation-placeholder
